<div th:fragment="messages">

  <div th:if="${mensagem}"
       class="mb-6 rounded-xl border border-emerald-500/30
              bg-emerald-500/10 px-4 py-3 text-sm text-emerald-300">
    <span th:text="${mensagem}"></span>
  </div>

  <div th:if="${erro}"
       class="mb-6 rounded-xl border border-red-500/30
              bg-red-500/10 px-4 py-3 text-sm text-red-300">
    <span th:text="${erro}"></span>
  </div>

</div>
