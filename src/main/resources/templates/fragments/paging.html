<!doctype html>
<html lang="pt_BR" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section
      th:fragment="paginator(resourcePath, navPage)"
      th:if="${navPage != null and navPage.totalPages > 1}"
      class="mt-6"
    >
      <nav aria-label="Paginador" class="flex items-center justify-center">
        <ul class="inline-flex items-center gap-6 text-sm">
          <li class="flex items-center gap-2">
            <th:block th:if="${navPage.currentPage > 1}">
              <span class="text-slate-400">Anterior</span>
              <a
                th:replace="~{fragments/paging :: page(${navPage.currentPage - 1}, ${navPage.pageSize}, '&laquo;', 'Página anterior', ${resourcePath})}"
              ></a>
            </th:block>
            <th:block th:unless="${navPage.currentPage > 1}">
              <span class="text-slate-600 opacity-40">Anterior &laquo;</span>
            </th:block>
          </li>

          <li>
            <span
              class="px-3 py-2 rounded-lg border border-indigo-500 bg-indigo-600 text-white cursor-default"
            >
              [[${navPage.currentPage}]] / [[${navPage.totalPages}]]
            </span>
          </li>

          <li class="flex items-center gap-2">
            <th:block th:if="${navPage.currentPage < navPage.totalPages}">
              <a
                th:replace="~{fragments/paging :: page(${navPage.currentPage + 1}, ${navPage.pageSize}, '&raquo;', 'Próxima página', ${resourcePath})}"
              ></a>
              <span class="text-slate-400">Próxima</span>
            </th:block>
            <th:block th:unless="${navPage.currentPage < navPage.totalPages}">
              <span class="text-slate-600 opacity-40">&raquo; Próxima</span>
            </th:block>
          </li>
        </ul>
      </nav>
    </section>

    <a
      th:fragment="page(pageNum, pageSize, label, tooltip, resourcePath)"
      class="px-3 py-2 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 transition"
      th:href="@{'/' + ${resourcePath} + '?page=' + ${pageNum} + '&size=' + ${pageSize}}"
      th:title="${tooltip}"
    >
      [(${label})]
    </a>

    <span
      th:fragment="pageNum(pageNum, pageSize, label, tooltip, resourcePath, currentPage)"
      th:classappend="${pageNum == currentPage} ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-500'"
      class="px-3 py-2 rounded-lg border transition cursor-default"
    >
      [(${label})]
    </span>
  </body>
</html>
