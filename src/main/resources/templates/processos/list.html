<!doctype html>
<html
  lang="pt_BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colegi+ - Processos Cadastrados</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
  </head>

  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <th:block th:replace="~{header :: menu}"></th:block>

    <main class="max-w-5xl mx-auto px-4 py-10">
      <h1 class="text-3xl font-bold tracking-tight mb-2">
        Processos <span class="text-indigo-400">Cadastrados</span>
      </h1>
      <hr class="border-slate-800 mb-6" />

      <div sec:authorize="hasRole('ALUNO')" class="mb-6">
        <form th:action="@{/processos/novo}" method="get">
          <button
            type="submit"
            class="bg-indigo-500 hover:bg-indigo-400 transition text-white px-4 py-2 rounded-lg text-sm font-medium shadow"
          >
            Cadastrar Novo Processo
          </button>
        </form>
      </div>

      <form
        sec:authorize="hasRole('ALUNO')"
        class="mb-6 flex flex-wrap gap-4 items-end text-sm"
        method="get"
        th:action="@{/processos}"
      >
        <div>
          <label class="block text-slate-300 mb-1">Status:</label>
          <select
            name="status"
            class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:ring-indigo-500 focus:outline-none"
            style="color: #000"
          >
            <option value="">Todos</option>
            <option
              value="CRIADO"
              th:selected="${statusSelecionado == 'CRIADO'}"
            >
              Criado
            </option>
            <option
              value="DISTRIBUIDO"
              th:selected="${statusSelecionado == 'DISTRIBUIDO'}"
            >
              Distribuído
            </option>
            <option
              value="EM_PAUTA"
              th:selected="${statusSelecionado == 'EM_PAUTA'}"
            >
              Em pauta
            </option>
            <option
              value="DISPONIVEL"
              th:selected="${statusSelecionado == 'DISPONIVEL'}"
            >
              Disponível
            </option>
            <option
              value="JULGADO"
              th:selected="${statusSelecionado == 'JULGADO'}"
            >
              Julgado
            </option>
          </select>
        </div>

        <div>
          <label class="block text-slate-300 mb-1">Assunto:</label>
          <select
            name="assuntoId"
            class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:ring-indigo-500 focus:outline-none"
            style="color: #000"
          >
            <option value="">Todos</option>
            <option
              th:each="a : ${assuntos}"
              th:value="${a.id}"
              th:text="${a.nome}"
              th:selected="${assuntoSelecionado != null and a.id == assuntoSelecionado}"
            ></option>
          </select>
        </div>

        <div>
          <label class="block text-slate-300 mb-1">Ordenar por data:</label>
          <select
            name="ordem"
            class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:ring-indigo-500 focus:outline-none"
            style="color: #000"
          >
            <option value="asc" th:selected="${ordemSelecionada == 'asc'}">
              Mais antigos
            </option>
            <option value="desc" th:selected="${ordemSelecionada == 'desc'}">
              Mais recentes
            </option>
          </select>
        </div>

        <button
          type="submit"
          class="bg-slate-800 hover:bg-slate-700 transition px-4 py-2 text-sm rounded-lg shadow border border-slate-700"
        >
          Filtrar
        </button>
      </form>

      <form
        sec:authorize="hasRole('COORDENADOR')"
        class="mb-6 flex flex-wrap gap-4 items-end text-sm"
        method="get"
        th:action="@{/processos}"
      >
        <div>
          <label class="block text-slate-300 mb-1">Status:</label>
          <select
            name="status"
            class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:ring-indigo-500 focus:outline-none"
            style="color: #000"
          >
            <option value="">Todos</option>
            <option
              value="CRIADO"
              th:selected="${statusSelecionado == 'CRIADO'}"
            >
              Criado
            </option>
            <option
              value="DISTRIBUIDO"
              th:selected="${statusSelecionado == 'DISTRIBUIDO'}"
            >
              Distribuído
            </option>
            <option
              value="EM_PAUTA"
              th:selected="${statusSelecionado == 'EM_PAUTA'}"
            >
              Em pauta
            </option>
            <option
              value="DISPONIVEL"
              th:selected="${statusSelecionado == 'DISPONIVEL'}"
            >
              Disponível
            </option>
            <option
              value="JULGADO"
              th:selected="${statusSelecionado == 'JULGADO'}"
            >
              Julgado
            </option>
          </select>
        </div>

        <div>
          <label class="block text-slate-300 mb-1">Aluno interessado:</label>
          <input
            type="text"
            name="nomeAluno"
            th:value="${nomeAluno}"
            class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:ring-indigo-500 focus:outline-none"
            style="color: #000"
          />
        </div>

        <div>
          <label class="block text-slate-300 mb-1">Professor relator:</label>
          <input
            type="text"
            name="nomeProfessor"
            th:value="${nomeProfessor}"
            class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:ring-indigo-500 focus:outline-none"
            style="color: #000"
          />
        </div>

        <button
          type="submit"
          class="bg-slate-800 hover:bg-slate-700 transition px-4 py-2 text-sm rounded-lg shadow border border-slate-700"
        >
          Filtrar
        </button>
      </form>

      <hr class="border-slate-800 mb-6" />

      <div class="overflow-x-auto">
        <table
          class="w-full text-sm border border-slate-800 rounded-lg overflow-hidden"
        >
          <thead class="bg-slate-900 border-b border-slate-800">
            <tr class="text-slate-300 text-xs uppercase tracking-wide">
              <th class="px-3 py-2 text-left align-middle">N. do processo</th>
              <th class="px-3 py-2 text-left align-middle">Assunto</th>
              <th class="px-3 py-2 text-left align-middle">
                Texto de Requerimento
              </th>
              <th class="px-3 py-2 text-left align-middle">Requerimento</th>
              <th class="px-3 py-2 text-left align-middle">Data de Recepção</th>
              <th class="px-3 py-2 text-left align-middle">Status</th>
              <th
                sec:authorize="hasAnyRole('PROFESSOR', 'COORDENADOR')"
                class="px-3 py-2 text-left align-middle"
              >
                Relator
              </th>
              <th
                sec:authorize="hasRole('COORDENADOR')"
                class="px-3 py-2 text-left align-middle"
              >
                Ações
              </th>
            </tr>
          </thead>

          <tbody class="divide-y divide-slate-800">
            <tr th:if="${processos.totalElements == 0}">
              <td
                colspan="100%"
                class="px-4 py-4 text-center text-slate-400 align-middle"
              >
                Nenhum processo encontrado.
              </td>
            </tr>

            <tr
              th:each="processo : ${processos.content}"
              class="hover:bg-slate-900 transition"
            >
              <td
                class="px-3 py-2 text-left align-middle"
                th:text="${processo.numero}"
              ></td>
              <td
                class="px-3 py-2 text-left align-middle"
                th:text="${processo.assunto != null ? processo.assunto.nome : 'N/A'}"
              ></td>
              <td
                class="px-3 py-2 text-left align-middle"
                th:text="${processo.textoRequerimento != null ? processo.textoRequerimento : 'N/A'}"
              ></td>
              <td class="px-3 py-2 text-left align-middle">
                <a
                  th:if="${processo.requerimentoPdf != null}"
                  th:href="@{/processos/{id}/requerimento(id=${processo.id})}"
                  class="text-indigo-400 hover:text-indigo-300 font-medium"
                >
                  Baixar PDF
                </a>
                <span
                  th:if="${processo.requerimentoPdf == null}"
                  class="text-slate-500 text-sm"
                  >—</span
                >
              </td>
              <td
                class="px-3 py-2 text-left align-middle"
                th:text="${processo.dataRecepcao != null ? #dates.format(processo.dataRecepcao, 'dd/MM/yyyy') : ''}"
              ></td>
              <td
                class="px-3 py-2 text-left align-middle"
                th:text="${processo.status}"
              ></td>

              <td
                sec:authorize="hasAnyRole('PROFESSOR', 'COORDENADOR')"
                class="px-3 py-2 text-left align-middle"
                th:text="${processo.relator != null ? processo.relator.nome : '—'}"
              ></td>

              <td
                sec:authorize="hasRole('COORDENADOR')"
                class="px-3 py-2 text-left align-middle"
              >
                <a
                  th:if="${processo.relator == null}"
                  th:href="@{/processos/{id}/distribuir(id=${processo.id})}"
                  class="text-indigo-400 hover:text-indigo-300 transition"
                >
                  Distribuir
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="mt-8" th:if="${navPage.totalPages > 1}"></div>
      <div class="mt-8">
            <div th:replace="~{fragments/paging :: paginator(${resourcePath}, ${navPage})}"></div>
      </div>
      <div class="mt-12 pb-10">
        <a
          th:href="@{/home}"
          class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg font-medium transition"
        >
          Voltar para Home
        </a>
      </div>
    </main>
  </body>
</html>
