<!doctype html>
<html lang="pt_BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colegi+ - Reuniões</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <th:block th:replace="~{header :: menu}"></th:block>

    <main class="max-w-5xl mx-auto px-4 py-10">
      <h1 class="text-3xl font-bold tracking-tight mb-2">
        Reuniões do <span class="text-indigo-400">Colegiado</span>
      </h1>
      <hr class="border-slate-800 mb-6" />

      <div th:if="${session.tipoUsuario == 'COORDENADOR'}" class="mb-6">
        <a
          th:href="@{/reunioes/nova}"
          style="
            background-color: #4f46e5;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
          "
        >
          Agendar Nova Reunião
        </a>
      </div>

      <form
        method="get"
        th:action="@{/reunioes}"
        class="mb-8 flex gap-4 items-end"
      >
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-400 uppercase font-semibold"
            >Status:</label
          >
          <select
            name="status"
            class="bg-slate-800 text-slate-100 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none min-w-[200px] transition-all"
          >
            <option value="">Todas as Reuniões</option>
            <option
              value="PROGRAMADA"
              th:selected="${statusSelecionado?.name() == 'PROGRAMADA'}"
            >
              Programada
            </option>
            <option
              value="ENCERRADA"
              th:selected="${statusSelecionado?.name() == 'ENCERRADA'}"
            >
              Encerrada
            </option>
          </select>
        </div>
        <button
          type="submit"
          class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg border border-slate-600 transition font-medium"
        >
          Filtrar
        </button>
      </form>

      <div
        class="overflow-x-auto bg-slate-900/40 rounded-xl border border-slate-800 shadow-2xl"
      >
        <table class="w-full text-sm text-left">
          <thead
            class="bg-slate-900/80 border-b border-slate-800 text-slate-400 text-xs uppercase tracking-widest"
          >
            <tr>
              <th class="px-6 py-4 font-bold">Data e Hora</th>
              <th class="px-6 py-4 font-bold">Colegiado</th>
              <th class="px-6 py-4 font-bold text-center">Status</th>
              <th class="px-6 py-4 font-bold text-center">Qtd. Processos</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800">
            <tr th:if="${#lists.isEmpty(reunioes)}">
              <td colspan="4" class="px-6 py-12 text-center">
                <div class="flex flex-col items-center gap-2">
                  <span class="text-slate-500 italic text-base"
                    >Nenhuma reunião encontrada para o filtro selecionado.</span
                  >
                  <a
                    th:href="@{/reunioes}"
                    class="text-indigo-400 hover:underline text-xs font-semibold"
                    >Limpar filtros</a
                  >
                </div>
              </td>
            </tr>

            <tr
              th:each="r : ${reunioes}"
              class="hover:bg-slate-800/40 transition"
            >
              <td
                class="px-6 py-4 font-medium"
                th:text="${r.data != null ? #dates.format(r.data, 'dd/MM/yyyy HH:mm') : 'Não definida'}"
              ></td>
              <td
                class="px-6 py-4 text-slate-400"
                th:text="${r.colegiado?.nome}"
              ></td>
              <td class="px-6 py-4 text-center">
                <span
                  th:text="${r.status}"
                  th:class="${r.status.name() == 'PROGRAMADA' ? 'text-indigo-400' : 'text-emerald-400'}"
                  class="font-bold text-xs uppercase bg-slate-800/50 px-2 py-1 rounded border border-slate-700"
                >
                </span>
              </td>
              <td
                class="px-6 py-4 text-center font-mono text-indigo-300"
                th:text="${r.processos?.size() ?: 0}"
              ></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
