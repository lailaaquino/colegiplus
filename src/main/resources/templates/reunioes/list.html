<!doctype html>
<html lang="pt_BR" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colegi+ - Reuniões</title>

    <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
  </head>

  <body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <th:block th:replace="~{header :: menu}"></th:block>

    <h1 class="text-3xl font-bold tracking-tight mb-4">
      Reuniões do <span class="text-indigo-400">Colegiado</span>
    </h1>

    <hr class="border-slate-800 mb-6" />

    <p th:if="${mensagemErro}" th:text="${mensagemErro}"
      class="mb-6 p-3 bg-rose-900/40 border border-rose-700 rounded-lg text-rose-300">
    </p>

    <p
      th:if="${mensagem}"
      th:text="${mensagem}"
      class="mb-6 p-3 bg-emerald-900/40 border border-emerald-700 rounded-lg text-emerald-300"
    ></p>

    <div sec:authorize="hasRole('COORDENADOR')" class="mb-6">
      <a
        th:href="@{/reunioes/nova}"
        class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg font-medium shadow transition inline-block"
      >
        Agendar Nova Reunião
      </a>
    </div>

    <form
      method="get"
      th:action="@{/reunioes}"
      class="mb-6 flex flex-wrap gap-4 items-end text-sm"
    >
      <div>
        <label class="block text-slate-300 mb-1">Status:</label>
        <select
          name="status"
          class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:ring-indigo-500 focus:outline-none"
          style="color:#000;"
        >
          <option value="">Todas</option>
          <option
            value="PROGRAMADA"
            th:selected="${statusSelecionado?.name() == 'PROGRAMADA'}"
          >
            Programada
          </option>
          <option
            value="ENCERRADA"
            th:selected="${statusSelecionado?.name() == 'ENCERRADA'}"
          >
            Encerrada
          </option>
          <option
            value="EM_JULGAMENTO"
            th:selected="${statusSelecionado?.name() == 'EM_JULGAMENTO'}"
          >
            Em Julgamento
          </option>

        </select>
      </div>

      <button
        type="submit"
        class="bg-slate-800 hover:bg-slate-700 transition px-4 py-2 text-sm rounded-lg shadow border border-slate-700"
      >
        Filtrar
      </button>

      <a
        th:href="@{/reunioes}"
        class="text-indigo-400 hover:text-indigo-300 transition text-sm underline underline-offset-4"
      >
        Limpar
      </a>
    </form>

    <hr class="border-slate-800 mb-6" />

    <div class="overflow-x-auto">
      <table class="w-full table-fixed text-sm border-collapse">
        <thead class="bg-slate-900 border-b border-slate-800">
          <tr class="text-xs uppercase tracking-wide text-slate-400">
            <th class="px-4 py-3 text-left align-middle w-1/5">Data e Hora</th>
            <th class="px-4 py-3 text-left align-middle w-1/5">Colegiado</th>
            <th class="px-4 py-3 text-left align-middle w-1/5">Status</th>
            <th class="px-4 py-3 text-left align-middle w-1/5">Qtd. Processos</th>
            <th class="px-4 py-3 text-left align-middle w-1/5">Ações</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-800">
          <tr th:if="${reunioes.totalElements == 0}">
            <td colspan="5" class="px-4 py-4 text-center align-middle text-slate-400">
              Nenhuma reunião encontrada.
            </td>
          </tr>

          <tr th:each="r : ${reunioes.content}" class="hover:bg-slate-900 transition">
            <td
              class="px-3 py-2 font-medium text-left align-middle"
              th:text="${r.data != null ? #dates.format(r.data, 'dd/MM/yyyy HH:mm') : 'Não definida'}"
            ></td>

            <td class="px-3 py-2 text-slate-300 text-left align-middle" th:text="${r.colegiado?.nome}"></td>

            <td class="px-3 py-2 text-left align-middle">
              <span
                th:text="${r.status}"
                th:class="${r.status.name() == 'PROGRAMADA' ? 'text-indigo-300' : 'text-emerald-300'}"
                class="inline-block font-bold text-xs uppercase bg-slate-900/70 px-2 py-1 rounded border border-slate-700"
              ></span>
            </td>

            <td
              class="px-3 py-2 font-mono text-indigo-300 text-left align-middle"
              th:text="${r.processos != null ? r.processos.size() : 0}"
            ></td>

            <td class="px-3 py-2 text-center align-middle">
              <form sec:authorize="hasRole('COORDENADOR')" 
                    th:if="${r.status.name() == 'PROGRAMADA'}"
                    th:action="@{/reunioes/{id}/iniciar(id=${r.id})}"
                    method="post">
                <button type="submit"
                        class="bg-indigo-500 hover:bg-indigo-400 text-white text-xs px-3 py-1.5 rounded-md transition shadow-sm font-semibold">
                  Iniciar Sessão
                </button>
              </form>

              <a sec:authorize="hasRole('COORDENADOR')" 
                 th:if="${r.status.name() == 'EM_JULGAMENTO'}"
                 th:href="@{/reunioes/{id}/conducao(id=${r.id})}"
                 class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-md transition shadow-sm font-semibold">
                Conduzir sessão
              </a>

              <a sec:authorize="hasAnyRole('PROFESSOR', 'COORDENADOR')" 
                 th:if="${r.status.name() == 'EM_JULGAMENTO'}"
                 th:href="@{/reunioes/{id}(id=${r.id})}"
                 class="inline-block bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs px-3 py-1.5 rounded-md transition shadow-sm border border-slate-700">
                Votar
              </a>

              <span th:if="${r.status.name() == 'PROGRAMADA'}"
                    class="text-indigo-300 text-xs font-bold italic block">
                Aguardando início
              </span>

              <span th:if="${r.status.name() == 'ENCERRADA'}"
                    class="text-slate-500 text-xs font-bold italic block">
                Sessão encerrada
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-8">
      <div th:replace="~{fragments/paging :: paginator(${resourcePath}, ${navPage})}"></div>
    </div>
  </body>
</html>
