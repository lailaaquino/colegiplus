<!doctype html>
<html lang="pt_BR" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head></head>

  <body>
    <th:block th:fragment="menu">
      <nav class="w-full bg-slate-900 border-b border-slate-800 px-6 py-4">
        <div class="flex items-center gap-16">
          <a th:href="@{/}" class="text-lg font-bold text-white tracking-tight">
            Colegi<span class="text-indigo-400">+</span>
          </a>

          <ul class="flex items-center gap-10 text-sm font-medium">
            
            <li sec:authorize="hasRole('ALUNO')" class="m-4">
              <a th:href="@{/processos}" class="text-slate-300 hover:text-indigo-400 transition">
                Meus Processos
              </a>
            </li>

            <li sec:authorize="hasRole('PROFESSOR')" class="m-4">
              <a th:href="@{/processos}" class="text-slate-300 hover:text-indigo-400 transition">
                Atribuídos
              </a>
            </li>

            <li sec:authorize="hasRole('COORDENADOR')" class="m-4">
              <a th:href="@{/processos}" class="text-slate-300 hover:text-indigo-400 transition">
                Distribuir
              </a>
            </li>

            <li sec:authorize="hasRole('ADMIN')" class="m-4">
              <a th:href="@{/assuntos}" class="text-slate-300 hover:text-indigo-400 transition">
                Assuntos
              </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" class="m-4">
              <a th:href="@{/colegiados}" class="text-slate-300 hover:text-indigo-400 transition">
                Colegiados
              </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" class="m-4">
              <a th:href="@{/professores}" class="text-slate-300 hover:text-indigo-400 transition">
                Professores
              </a>
            </li>

            <li sec:authorize="hasAnyRole('PROFESSOR', 'COORDENADOR')" class="m-4">
              <a th:href="@{/reunioes}" class="text-slate-300 hover:text-indigo-400 transition">
                Reuniões
              </a>
            </li>

            <li sec:authorize="isAuthenticated()" class="m-4">
              <a th:href="@{/logout}" class="text-red-400 hover:text-red-300 transition font-semibold">
                Sair
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </th:block>
  </body>
</html>
