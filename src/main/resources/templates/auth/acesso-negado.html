<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Negado • Colegi+</title>

    <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-100">
    <th:block th:replace="~{header :: menu}"></th:block>

    <main class="max-w-3xl mx-auto px-4 py-16">
      <div
        class="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-xl p-10 text-center"
      >
        <div class="flex justify-center mb-6">
          <div
            class="flex items-center justify-center w-16 h-16 rounded-full bg-red-500/10 border border-red-500/30"
          >
          </div>
        </div>

        <h1 class="text-3xl font-bold tracking-tight mb-3">
          Acesso Negado!
        </h1>

        <p class="text-slate-300 mb-8">
          O seu perfil não permite o acesso a este recurso.
          <br />
          Caso acredite que isso seja um erro, entre em contato com o administrador do sistema.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
          <a
            th:href="@{/home}"
            class="inline-flex items-center justify-center rounded-full bg-indigo-500 px-6 py-2.5 text-sm font-medium text-white shadow hover:bg-indigo-400 transition"
          >
            Voltar para a página inicial
        </div>
      </div>
    </main>
  </body>
</html>
